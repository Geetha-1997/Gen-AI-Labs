apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gen-ai-labs-api, namespace: gen-ai-labs }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gen-ai-labs-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gen-ai-labs-web, namespace: gen-ai-labs }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gen-ai-labs-web }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gen-ai-labs-api, namespace: gen-ai-labs }
spec: { minAvailable: 1, selector: { matchLabels: { app: gen-ai-labs-api } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gen-ai-labs-web, namespace: gen-ai-labs }
spec: { minAvailable: 1, selector: { matchLabels: { app: gen-ai-labs-web } } }
