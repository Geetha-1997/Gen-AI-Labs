# Apply only after installing a compatible Karpenter release and creating its controller + node IAM roles.
# Tag private subnets and security groups with karpenter.sh/discovery: YOUR_CLUSTER_NAME.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gen-ai-labs-workers
spec:
  amiFamily: AL2023
  role: KarpenterNodeRole-YOUR_CLUSTER_NAME
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: YOUR_CLUSTER_NAME }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: YOUR_CLUSTER_NAME }
  amiSelectorTerms:
    - alias: al2023@latest
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: { volumeSize: 50Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true }
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gen-ai-labs-workers
spec:
  template:
    metadata: { labels: { workload: gen-ai-labs } }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gen-ai-labs-workers }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: kubernetes.io/os, operator: In, values: [linux] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [t, m, c] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["2"] }
  limits: { cpu: "1000", memory: 2000Gi }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
