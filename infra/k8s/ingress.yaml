apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gen-ai-labs
  namespace: gen-ai-labs
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:AWS_REGION:AWS_ACCOUNT_ID:certificate/REPLACE_ME
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300,deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gen-ai-labs-api, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: gen-ai-labs-api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: gen-ai-labs-web, port: { number: 80 } } }
