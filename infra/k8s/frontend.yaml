apiVersion: apps/v1
kind: Deployment
metadata: { name: gen-ai-labs-web, namespace: gen-ai-labs }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: gen-ai-labs-web } }
  template:
    metadata: { labels: { app: gen-ai-labs-web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/gen-ai-labs-web:latest
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: cache, mountPath: /var/cache/nginx }, { name: run, mountPath: /var/run }, { name: logs, mountPath: /var/log/nginx }]
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: logs, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: gen-ai-labs-web, namespace: gen-ai-labs }
spec:
  selector: { app: gen-ai-labs-web }
  ports: [{ name: http, port: 80, targetPort: http }]
  type: ClusterIP
