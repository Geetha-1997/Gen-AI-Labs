apiVersion: v1
kind: ServiceAccount
metadata:
  name: gen-ai-labs-api
  namespace: gen-ai-labs
  annotations:
    # Optional IRSA role for AWS access (e.g. Secrets Manager); replace ARN after provisioning.
    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/GenAiLabsApiRole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen-ai-labs-api
  namespace: gen-ai-labs
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector: { matchLabels: { app: gen-ai-labs-api } }
  template:
    metadata: { labels: { app: gen-ai-labs-api } }
    spec:
      serviceAccountName: gen-ai-labs-api
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/gen-ai-labs-api:latest
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: ENVIRONMENT, value: production }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: gen-ai-labs-secrets, key: database-url } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: gen-ai-labs-secrets, key: jwt-secret } } }
            - { name: GROQ_API_KEY, valueFrom: { secretKeyRef: { name: gen-ai-labs-secrets, key: groq-api-key } } }
            - { name: GROQ_MODEL, value: openai/gpt-oss-120b }
            - { name: CORS_ORIGINS, value: https://app.example.com }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: gen-ai-labs-api, namespace: gen-ai-labs }
spec:
  selector: { app: gen-ai-labs-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
  type: ClusterIP
