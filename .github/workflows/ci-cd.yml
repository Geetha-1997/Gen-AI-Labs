name: Gen-AI-Labs CI and Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen-ai-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests with coverage
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production-123456
          DATABASE_URL: postgresql+psycopg://genai:genai@localhost:5432/genai
          GROQ_API_KEY: ''
        run: python -m pytest -q --cov=app --cov-report=xml:coverage.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend-tests:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ''
          VITE_MODEL_NAME: Llama

  source-security:
    name: Trivy source and dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Scan repository for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  sonarqube:
    name: SonarQube code quality analysis
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Explain skipped SonarQube scan
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo 'SonarQube scan skipped. Configure SONAR_TOKEN secret and SONAR_HOST_URL repository variable.'

  docker-build-and-scan:
    name: Docker build and Trivy image scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, source-security]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gen-ai-labs-api:${{ github.sha }} ./backend
      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL= \
            --build-arg VITE_MODEL_NAME=Llama \
            -t gen-ai-labs-web:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gen-ai-labs-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gen-ai-labs-web:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
