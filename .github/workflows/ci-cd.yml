name: Gen-AI-Labs CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gen-ai-labs-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_API_REPOSITORY: gen-ai-labs-api
  ECR_WEB_REPOSITORY: gen-ai-labs-web

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Test backend
        run: |
          python -m compileall -q app
          python -m pytest -q
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

  publish-deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_MODEL_NAME=Llama
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Run database migrations
        run: |
          sed "s|AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/gen-ai-labs-api:latest|${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ github.sha }}|" infra/k8s/migration-job.yaml > /tmp/gen-ai-labs-migration.yaml

          kubectl -n gen-ai-labs delete job gen-ai-labs-migrate --ignore-not-found=true
          kubectl apply -f /tmp/gen-ai-labs-migration.yaml
          kubectl -n gen-ai-labs wait --for=condition=complete job/gen-ai-labs-migrate --timeout=300s

      - name: Deploy immutable images
        run: |
          kubectl -n gen-ai-labs set image deployment/gen-ai-labs-api api=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${GITHUB_SHA}

          kubectl -n gen-ai-labs set image deployment/gen-ai-labs-web web=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${GITHUB_SHA}

          kubectl -n gen-ai-labs rollout status deployment/gen-ai-labs-api --timeout=300s
          kubectl -n gen-ai-labs rollout status deployment/gen-ai-labs-web --timeout=300s
