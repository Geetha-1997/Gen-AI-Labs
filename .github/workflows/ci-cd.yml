
name: Gen-AI-Labs CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen-ai-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run backend tests
        env:
          JWT_SECRET: ci-only-test-secret-not-for-production-123456
          DATABASE_URL: postgresql+psycopg://genai:genai@localhost:5432/genai
          GROQ_API_KEY: ""
        run: python -m pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_MODEL_NAME: Llama

  docker-build:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gen-ai-labs-api:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL= \
            --build-arg VITE_MODEL_NAME=Llama \
            -t gen-ai-labs-web:ci ./frontend
