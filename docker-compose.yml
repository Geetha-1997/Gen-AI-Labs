services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: genai, POSTGRES_USER: genai, POSTGRES_PASSWORD: genai-local-only }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U genai -d genai"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-deploy}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: { context: ./frontend, args: { VITE_API_URL: "http://localhost:8000" } }
    ports: ["8081:8080"]
    depends_on: [backend]
volumes:
  postgres_data:
